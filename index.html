<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="여성향 AI 채팅 남성 캐릭터 이미지 포트폴리오">
  <meta name="theme-color" content="#100e12">
  <title>Male Character Portfolio</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap");

    :root {
      color-scheme: dark;
      --bg: #100e12;
      --surface: #19161c;
      --ink: #f4edf0;
      --muted: #a89fa6;
      --accent: #bd8d96;
      --line: rgba(255, 255, 255, .11);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 85% 5%, rgba(143, 77, 95, .16), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      font-weight: 300;
    }

    button { font: inherit; }
    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 26px;
    }

    h2 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      font-weight: 500;
    }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      aspect-ratio: 2 / 3;
      padding: 0;
      border: 0;
      background: var(--surface);
      color: var(--ink);
      cursor: zoom-in;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2, .7, .2, 1), filter .4s ease;
    }

    .card::after {
      position: absolute;
      inset: 35% 0 0;
      content: "";
      background: linear-gradient(transparent, rgba(11, 8, 12, .92));
      pointer-events: none;
    }

    .card:hover img { transform: scale(1.035); filter: saturate(1.06); }
    .caption {
      position: absolute;
      z-index: 1;
      right: 18px;
      bottom: 17px;
      left: 18px;
      text-align: left;
    }
    .caption b { display: block; font-size: 14px; font-weight: 500; }
    .caption span { color: #bfb5ba; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }

    dialog {
      width: min(92vw, 820px);
      max-height: 94vh;
      padding: 0;
      border: 1px solid var(--line);
      background: #09080a;
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(5, 4, 6, .9); backdrop-filter: blur(8px); }
    dialog img { display: block; width: 100%; max-height: 88vh; object-fit: contain; }
    dialog button {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      background: rgba(8, 7, 9, .72);
      color: white;
      cursor: pointer;
    }

    @media (max-width: 840px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .wrap { width: min(100% - 24px, 1180px); }
      .gallery { gap: 6px; }
      .caption { right: 10px; bottom: 10px; left: 10px; }
      .caption b { font-size: 12px; }
      .section-head p { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card img { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <section id="characters" aria-labelledby="characters-title">
        <div class="section-head">
          <h2 id="characters-title">Sample Image</h2>
          <p>이미지를 눌러 크게 볼 수 있습니다.</p>
        </div>
        <div class="gallery">
          <button class="card" data-full="assets/01-gentle-bookstore.webp"><img src="assets/01-gentle-bookstore.webp" alt="다정한 서점 주인 캐릭터" loading="eager"><span class="caption"><b>다정한 서점 주인</b><span>Gentle · Modern</span></span></button>
          <button class="card" data-full="assets/02-cold-director.webp"><img src="assets/02-cold-director.webp" alt="냉정한 전략 이사 캐릭터" loading="eager"><span class="caption"><b>냉정한 전략 이사</b><span>Cold · Office</span></span></button>
          <button class="card" data-full="assets/03-sly-bartender.webp"><img src="assets/03-sly-bartender.webp" alt="능글맞은 호텔 바텐더 캐릭터" loading="lazy"><span class="caption"><b>능글맞은 바텐더</b><span>Sly · Night</span></span></button>
          <button class="card" data-full="assets/04-knight-commander.webp"><img src="assets/04-knight-commander.webp" alt="과묵한 기사단장 캐릭터" loading="lazy"><span class="caption"><b>과묵한 기사단장</b><span>Loyal · Fantasy</span></span></button>
          <button class="card" data-full="assets/05-gentle-doctor.webp"><img src="assets/05-gentle-doctor.webp" alt="다정한 응급의학과 의사 캐릭터" loading="lazy"><span class="caption"><b>지친 듯 다정한 의사</b><span>Calm · Medical</span></span></button>
          <button class="card" data-full="assets/06-occult-detective.webp"><img src="assets/06-occult-detective.webp" alt="미스터리한 오컬트 탐정 캐릭터" loading="lazy"><span class="caption"><b>오컬트 전문 탐정</b><span>Gothic · Mystery</span></span></button>
          <button class="card" data-full="assets/07-swimmer.webp"><img src="assets/07-swimmer.webp" alt="밝은 수영 선수 캐릭터" loading="lazy"><span class="caption"><b>햇살 같은 수영 선수</b><span>Bright · Sports</span></span></button>
          <button class="card" data-full="assets/08-underworld-heir.webp"><img src="assets/08-underworld-heir.webp" alt="위험한 후계자 캐릭터" loading="lazy"><span class="caption"><b>위험한 후계자</b><span>Possessive · Noir</span></span></button>
        </div>
      </section>

    </main>
  </div>

  <dialog id="lightbox" aria-label="이미지 크게 보기">
    <button type="button" aria-label="닫기">✕</button>
    <img alt="">
  </dialog>

  <script>
    const lightbox = document.querySelector("#lightbox");
    const lightboxImage = lightbox.querySelector("img");
    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        const image = card.querySelector("img");
        lightboxImage.src = card.dataset.full;
        lightboxImage.alt = image.alt;
        lightbox.showModal();
      });
    });
    lightbox.querySelector("button").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>
</body>
</html>
